<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Market - DummyJSON API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar / Header Area dengan gaya soft purple -->
        <div class="hero-section">
            <div class="hero-content">
                <div class="logo-icon">✨</div>
                <h1>Phantom Market</h1>
                <p>Mysterious Product Management</p>
            </div>
        </div>

        <div class="main-container">
            <!-- Form Card -->
            <div class="card form-card">
                <div class="card-header">
                    <span class="card-icon">📝</span>
                    <h2 id="form-title">Tambah Produk Baru</h2>
                </div>
                <form id="product-form">
                    <div class="input-group">
                        <label for="product-name">
                            <span class="label-icon">🏷️</span>
                            Nama Produk
                        </label>
                        <input type="text" id="product-name" placeholder="Contoh: Wireless Mouse" required>
                    </div>
                    <div class="input-group">
                        <label for="product-price">
                            <span class="label-icon">💰</span>
                            Harga Produk
                        </label>
                        <input type="number" id="product-price" placeholder="Contoh: 250000" required>
                    </div>
                    <div class="input-group">
                        <label for="product-brand">
                            <span class="label-icon">🏢</span>
                            Brand (Opsional)
                        </label>
                        <input type="text" id="product-brand" placeholder="Contoh: Logitech">
                    </div>
                    <div class="input-group">
                        <label for="product-category">
                            <span class="label-icon">📂</span>
                            Kategori (Opsional)
                        </label>
                        <input type="text" id="product-category" placeholder="Contoh: Elektronik">
                    </div>
                    <div class="button-group">
                        <button type="submit" id="submit-btn" class="btn btn-primary">
                            <span>➕</span> Tambah Produk
                        </button>
                        <button type="button" id="cancel-btn" class="btn btn-outline" style="display: none;">
                            <span>✖️</span> Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Products List Section -->
            <div class="products-section">
                <div class="section-header">
                    <span class="section-icon">📦</span>
                    <h2>Koleksi Produk</h2>
                    <span class="product-count" id="product-count">0 Produk</span>
                </div>
                <div id="products-list" class="products-grid">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Memuat produk...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
